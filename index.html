<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Intelligence Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            height: 100vh;
            overflow: hidden;
        }

        /* Glassmorphism utilities */
        .glass-panel {
            background: rgba(28, 28, 30, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .glass-input:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.08);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* Background ambient glow */
        .bg-glow {
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 50% 50%, rgba(34, 171, 148, 0.05) 0%, rgba(0,0,0,0) 50%),
                        radial-gradient(circle at 80% 20%, rgba(59, 130, 246, 0.05) 0%, rgba(0,0,0,0) 40%);
            z-index: -1;
            pointer-events: none;
        }

        /* TradingView container normalization */
        .tv-widget-box {
            width: 100%;
            height: 100%;
            min-height: 400px;
            border-radius: 12px;
            overflow: hidden;
        }

        /* State-based Mobile Routing View transitions */
        @media (max-width: 768px) {
            body {
                overflow-y: auto;
                height: auto;
                display: block;
            }
            .mobile-view-container {
                display: flex;
                flex-direction: column;
                min-height: 100vh;
            }
            .sidebar-section {
                width: 100%;
                height: 100vh;
            }
            .dashboard-section {
                width: 100%;
                min-height: 100vh;
            }
            
            /* View Toggling Rules */
            body:not(.view-dashboard) .dashboard-section {
                display: none !important;
            }
            body:not(.view-dashboard) .sidebar-section {
                display: flex !important;
            }
            body.view-dashboard .sidebar-section {
                display: none !important;
            }
            body.view-dashboard .dashboard-section {
                display: block !important;
            }
        }

        /* Transition utilities */
        .transition-transform { transition: transform 0.3s ease; }
        .line-clamp-4 {
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;  
            overflow: hidden;
        }
    </style>
</head>
<body class="flex flex-col md:flex-row antialiased mobile-view-container">
    <div class="bg-glow"></div>

    <!-- Sidebar: Filters and List -->
    <div id="sidebar" class="sidebar-section w-full md:w-96 flex flex-col h-full border-r border-white/10 glass-panel z-10 flex-shrink-0">
        <div class="p-5 border-b border-white/10">
            <h1 class="text-xl font-semibold mb-6 tracking-tight">Signal Scanner</h1>
            
            <!-- Ticker Search -->
            <div class="mb-4">
                <input type="text" id="filter-ticker" placeholder="Search Ticker..." 
                    class="w-full text-xs p-2 rounded-lg glass-input">
            </div>

            <!-- Filters -->
            <div class="grid grid-cols-2 gap-3 text-xs">
                <div>
                    <label class="text-white/50 mb-1 block">Trading Setup</label>
                    <select id="filter-setup" class="w-full p-2 rounded-lg glass-input appearance-none">
                        <option value="All">All</option>
                    </select>
                </div>
                <div>
                    <label class="text-white/50 mb-1 block">ST Sentiment</label>
                    <select id="filter-st-sent" class="w-full p-2 rounded-lg glass-input appearance-none">
                        <option value="All">All</option>
                    </select>
                </div>
                <div>
                    <label class="text-white/50 mb-1 block">LT Sentiment</label>
                    <select id="filter-lt-sent" class="w-full p-2 rounded-lg glass-input appearance-none">
                        <option value="All">All</option>
                    </select>
                </div>
                <div>
                    <label class="text-white/50 mb-1 block">Trajectory Setup</label>
                    <select id="filter-traj" class="w-full p-2 rounded-lg glass-input appearance-none">
                        <option value="All">All</option>
                    </select>
                </div>
                <!-- Subreddit Filter -->
                <div class="col-span-2">
                    <label class="text-white/50 mb-1 block">Subreddit Activity (> 0 Mentions)</label>
                    <select id="filter-subreddit" class="w-full p-2 rounded-lg glass-input appearance-none">
                        <option value="All">All</option>
                    </select>
                </div>
                <!-- Mentions Slider -->
                <div class="col-span-2 mt-1">
                    <div class="flex justify-between items-center text-white/50 mb-2">
                        <label>Min Total Mentions</label>
                        <span id="mentions-val" class="font-semibold text-white">0</span>
                    </div>
                    <input type="range" id="filter-mentions" min="0" max="100" value="0" 
                        class="w-full accent-emerald-500 h-1 bg-white/20 rounded-lg appearance-none cursor-pointer">
                </div>
            </div>
        </div>

        <!-- Stock List -->
        <div id="stock-list" class="flex-1 overflow-y-auto p-3 space-y-2">
            <div class="text-center text-white/50 text-sm mt-10">Loading data...</div>
        </div>
    </div>

    <!-- Dashboard: Metrics and Widgets -->
    <div id="dashboard" class="dashboard-section flex-1 h-full overflow-y-auto relative hidden md:block pb-10">
        
        <!-- Mobile Back Button -->
        <div class="sticky top-0 z-20 md:hidden p-4 glass-panel border-b border-white/10 flex items-center justify-between shadow-lg">
            <button onclick="backToList()" class="text-sm font-medium bg-white/10 px-4 py-2 rounded-lg flex items-center gap-2 hover:bg-white/20 transition-colors">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                Back to List
            </button>
            <span id="mobile-ticker-title" class="font-bold text-lg tracking-tight"></span>
        </div>

        <div id="dashboard-content" class="p-6 max-w-7xl mx-auto hidden">
            <!-- Header -->
            <div class="mb-8 flex items-end justify-between">
                <div>
                    <h2 id="dash-symbol" class="text-4xl font-bold tracking-tighter">AAPL</h2>
                    <p id="dash-date" class="text-white/50 text-sm mt-1"></p>
                </div>
                <div class="flex gap-2" id="dash-badges">
                    <!-- Badges injected here -->
                </div>
            </div>

            <!-- Ordered Flow of Modules -->
            <div class="flex flex-col gap-6">
                
                <!-- 1. Main Chart Overview (Ticker Widget) -->
                <div class="glass-panel p-1 rounded-2xl border border-white/10 h-[500px]">
                    <div id="tv-overview" class="w-full h-full rounded-xl overflow-hidden relative"></div>
                </div>

                <!-- 2. Qualitative Summaries Card Component -->
                <div class="glass-panel rounded-2xl border border-white/10 p-6 relative flex flex-col justify-center min-h-[240px]">
                    
                    <!-- Header: Title & Expand Button -->
                    <div class="absolute top-5 left-6 right-6 flex justify-between items-center z-20">
                        <span class="text-sm font-semibold text-white/50 uppercase tracking-wider">Retail Sentiment Summary</span>
                        <button onclick="openSummaryModal()" class="p-1 text-white/50 hover:text-white hover:bg-white/10 rounded transition-colors" title="Expand Details">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
                        </button>
                    </div>

                    <div class="flex items-center justify-between w-full h-full mt-8">
                        <!-- Left Arrow -->
                        <button onclick="prevSummary()" class="p-2 rounded-full hover:bg-white/10 transition-colors z-10 flex-shrink-0 text-white/50 hover:text-white">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
                        </button>
                        
                        <!-- Content -->
                        <div class="text-center flex-1 px-4 max-w-3xl mx-auto h-full flex flex-col justify-center">
                            <h3 id="summary-title" class="text-base font-bold mb-4 uppercase tracking-widest text-emerald-400">Short Term Bull</h3>
                            <p id="summary-text" class="text-sm md:text-base leading-relaxed text-white/80 line-clamp-4">Select a stock to view analytical summaries.</p>
                        </div>
                        
                        <!-- Right Arrow -->
                        <button onclick="nextSummary()" class="p-2 rounded-full hover:bg-white/10 transition-colors z-10 flex-shrink-0 text-white/50 hover:text-white">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
                        </button>
                    </div>

                    <!-- Pagination Dots -->
                    <div class="absolute bottom-4 left-1/2 -translate-x-1/2 flex gap-1.5">
                        <div id="dot-0" class="w-1.5 h-1.5 rounded-full bg-white/80 transition-colors duration-300"></div>
                        <div id="dot-1" class="w-1.5 h-1.5 rounded-full bg-white/20 transition-colors duration-300"></div>
                        <div id="dot-2" class="w-1.5 h-1.5 rounded-full bg-white/20 transition-colors duration-300"></div>
                        <div id="dot-3" class="w-1.5 h-1.5 rounded-full bg-white/20 transition-colors duration-300"></div>
                    </div>
                </div>

                <!-- 3, 4, 5, 6. Secondary Widgets Grid -->
                <!-- Order customized for flow: Technical -> Financials -> News -> Info -->
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    
                    <!-- Technical Analysis -->
                    <div class="glass-panel p-1 rounded-2xl border border-white/10 tv-widget-box relative order-1">
                        <div id="tv-technical" class="w-full h-full rounded-xl overflow-hidden"></div>
                    </div>

                    <!-- Financials -->
                    <div class="glass-panel p-1 rounded-2xl border border-white/10 tv-widget-box relative order-2">
                        <div id="tv-financials" class="w-full h-full rounded-xl overflow-hidden"></div>
                    </div>

                    <!-- News (Timeline) -->
                    <div class="glass-panel p-1 rounded-2xl border border-white/10 tv-widget-box relative order-3">
                        <div id="tv-timeline" class="w-full h-full rounded-xl overflow-hidden"></div>
                    </div>

                    <!-- Info Widget -->
                    <div class="glass-panel p-1 rounded-2xl border border-white/10 tv-widget-box relative order-4">
                        <div id="tv-info" class="w-full h-full rounded-xl overflow-hidden"></div>
                    </div>
                </div>

                <!-- 7. Quantitative Metrics (Collapsible) -->
                <div class="glass-panel rounded-2xl border border-white/10 mt-2">
                    <button onclick="toggleMetrics()" class="w-full flex items-center justify-between p-6 hover:bg-white/[0.02] transition-colors rounded-2xl">
                        <h3 class="text-sm font-semibold text-white/50 uppercase tracking-wider">Quantitative Metrics</h3>
                        <svg id="metrics-chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="text-white/50 transition-transform duration-300 transform rotate-180">
                            <path d="M6 9l6 6 6-6"/>
                        </svg>
                    </button>
                    <!-- Default open state (no 'hidden' class initially) -->
                    <div id="metrics-content" class="px-6 pb-6 pt-0 border-t border-white/5 mt-2">
                        <div id="metrics-grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4 text-sm mt-4">
                            <!-- Metrics injected here -->
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="absolute inset-0 flex items-center justify-center text-white/30 text-sm">
            Select a stock from the list to view intelligence.
        </div>
    </div>

    <!-- Modal for Expanded Summary -->
    <div id="summary-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
        <div class="glass-panel p-6 md:p-8 rounded-2xl border border-white/10 max-w-3xl w-full relative shadow-2xl flex flex-col">
            <!-- Close Button -->
            <button onclick="closeSummaryModal()" class="absolute top-4 right-4 p-2 text-white/50 hover:text-white hover:bg-white/10 rounded-full transition-colors z-10">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </button>
            
            <div class="mb-2 text-center">
                <span class="text-xs font-semibold text-white/50 uppercase tracking-wider">Retail Sentiment Summary</span>
            </div>
            
            <div class="flex items-center justify-between mt-2">
                <!-- Left Arrow -->
                <button onclick="prevSummary()" class="p-2 rounded-full hover:bg-white/10 transition-colors z-10 flex-shrink-0 text-white/50 hover:text-white">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
                </button>

                <div class="flex-1 px-4 md:px-8 text-center flex flex-col max-h-[60vh]">
                    <h3 id="modal-title" class="text-xl font-bold mb-6 uppercase tracking-widest text-emerald-400">Short Term Bull</h3>
                    <div class="overflow-y-auto pr-2 custom-scrollbar text-left flex-1">
                        <p id="modal-text" class="text-base md:text-lg leading-relaxed text-white/90 whitespace-pre-wrap">Summary text will appear here.</p>
                    </div>
                </div>

                <!-- Right Arrow -->
                <button onclick="nextSummary()" class="p-2 rounded-full hover:bg-white/10 transition-colors z-10 flex-shrink-0 text-white/50 hover:text-white">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        const mockCsvData = `Date,Symbol,Total Mentions,stocks,wallstreetbets,options,ST Sentiment,LT Sentiment,Trading_Setup,Trajectory_Setup,ST_NSS_Norm,LT_NSS_Norm,Setup_Duration,RVol,ST Bull Summary,ST Bear Summary,LT Bull Summary,LT Bear Summary
2026-04-10,AAOI,8,2,6,0,Very Bull,Very Bull,Breakout,Upward,1.0,1.0,1,1.5,Strong upside momentum detected on recent earnings.,Overbought conditions might trigger slight pullback.,Positioned well for next gen fiber rollouts.,Supply chain constraints remain a risk factor.
2026-04-10,AAPL,150,50,80,20,Bull,Bull,Consolidation,Stable,0.8,0.7,3,0.9,Approaching key support levels offering entry point.,Regulatory headwinds continue to suppress short term growth.,Services revenue expanding margins steadily.,Hardware supercycle relies heavily on uncertain consumer demand.`;

        let globalData = [];
        let filteredData = [];
        let currentSymbol = null;
        let subredditsList = [];

        // Summary Card State
        let summaryIdx = 0;
        let currentSummaries = [
            { title: "Short Term Bull", text: "", color: "text-emerald-400" },
            { title: "Short Term Bear", text: "", color: "text-rose-400" },
            { title: "Long Term Bull", text: "", color: "text-emerald-400" },
            { title: "Long Term Bear", text: "", color: "text-rose-400" }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            setupFilterListeners();
            loadData();
        });

        function setupFilterListeners() {
            const filters = ['setup', 'st-sent', 'lt-sent', 'traj', 'subreddit'];
            filters.forEach(f => {
                document.getElementById(`filter-${f}`).addEventListener('change', applyFilters);
            });
            
            document.getElementById('filter-ticker').addEventListener('input', applyFilters);
            
            const mentionsSlider = document.getElementById('filter-mentions');
            mentionsSlider.addEventListener('input', (e) => {
                document.getElementById('mentions-val').textContent = e.target.value;
            });
            mentionsSlider.addEventListener('change', applyFilters);
        }

        async function loadData() {
            const url = 'Today_Final_Signals.csv';
            const listContainer = document.getElementById('stock-list');

            listContainer.innerHTML = '<div class="text-center text-white/50 text-sm mt-10">Fetching remote data...</div>';
            
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const text = await response.text();
                parseData(text);
            } catch (error) {
                console.error("Error fetching CSV:", error);
                listContainer.innerHTML = '<div class="text-center text-rose-400 text-sm mt-10">Failed to load CSV. Reverting to mock data.</div>';
                setTimeout(() => {
                    parseData(mockCsvData);
                }, 1500);
            }
        }

        function parseData(csvString) {
            Papa.parse(csvString, {
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    globalData = results.data.filter(row => row.Symbol && row.Symbol.trim() !== '');
                    populateFilters();
                    applyFilters();
                }
            });
        }

        function populateFilters() {
            const setups = new Set();
            const stSents = new Set();
            const ltSents = new Set();
            const trajs = new Set();
            let maxMentions = 0;

            // Dynamically identify subreddits based on column position (between Total Mentions and ST Sentiment related fields)
            if (globalData.length > 0) {
                const keys = Object.keys(globalData[0]);
                const startIdx = keys.indexOf('Total Mentions');
                const endIdx = keys.findIndex(k => k.startsWith('ST ') || k === 'ST Sentiment');
                
                if (startIdx !== -1 && endIdx !== -1 && endIdx > startIdx + 1) {
                    subredditsList = keys.slice(startIdx + 1, endIdx);
                } else {
                    // Fallback to known subreddits if headers differ
                    const knownSubs = ['stocks', 'stockmarket', 'ValueInvesting', 'SecurityAnalysis', 'options', 'unusual_whales', 'Daytrading', 'swingtrading', 'wallstreetbets', 'stockstobuytoday', 'DeepMarketScan', 'investing', 'thetagang', 'smallstreetbets'];
                    subredditsList = keys.filter(k => knownSubs.includes(k));
                }
            }

            globalData.forEach(row => {
                if (row['Trading_Setup']) setups.add(row['Trading_Setup']);
                if (row['ST Sentiment']) stSents.add(row['ST Sentiment']);
                if (row['LT Sentiment']) ltSents.add(row['LT Sentiment']);
                if (row['Trajectory_Setup']) trajs.add(row['Trajectory_Setup']);
                
                const mentions = parseInt(row['Total Mentions']) || 0;
                if (mentions > maxMentions) maxMentions = mentions;
            });

            fillSelect('filter-setup', setups);
            fillSelect('filter-st-sent', stSents);
            fillSelect('filter-lt-sent', ltSents);
            fillSelect('filter-traj', trajs);
            
            const subSelect = document.getElementById('filter-subreddit');
            subSelect.innerHTML = '<option value="All">All</option>';
            subredditsList.forEach(sub => {
                const opt = document.createElement('option');
                opt.value = sub;
                opt.textContent = sub;
                subSelect.appendChild(opt);
            });

            const mentionsSlider = document.getElementById('filter-mentions');
            mentionsSlider.max = maxMentions;
            mentionsSlider.value = 0;
            document.getElementById('mentions-val').textContent = '0';
        }

        function fillSelect(id, set) {
            const select = document.getElementById(id);
            select.innerHTML = '<option value="All">All</option>';
            Array.from(set).filter(Boolean).sort().forEach(val => {
                const opt = document.createElement('option');
                opt.value = val;
                opt.textContent = val;
                select.appendChild(opt);
            });
        }

        function applyFilters() {
            const setup = document.getElementById('filter-setup').value;
            const stSent = document.getElementById('filter-st-sent').value;
            const ltSent = document.getElementById('filter-lt-sent').value;
            const traj = document.getElementById('filter-traj').value;
            const subreddit = document.getElementById('filter-subreddit').value;
            const minMentions = parseInt(document.getElementById('filter-mentions').value) || 0;
            const tickerSearch = document.getElementById('filter-ticker').value.trim().toLowerCase();

            filteredData = globalData.filter(row => {
                const symbolMatch = row.Symbol.toLowerCase().includes(tickerSearch);
                const setupMatch = setup === 'All' || row['Trading_Setup'] === setup;
                const stSentMatch = stSent === 'All' || row['ST Sentiment'] === stSent;
                const ltSentMatch = ltSent === 'All' || row['LT Sentiment'] === ltSent;
                const trajMatch = traj === 'All' || row['Trajectory_Setup'] === traj;
                const mentionsMatch = (parseInt(row['Total Mentions']) || 0) >= minMentions;
                
                let subredditMatch = true;
                if (subreddit !== 'All') {
                    subredditMatch = (parseFloat(row[subreddit]) || 0) > 0;
                }

                return symbolMatch && setupMatch && stSentMatch && ltSentMatch && trajMatch && mentionsMatch && subredditMatch;
            });

            renderList();
        }

        function renderList() {
            const container = document.getElementById('stock-list');
            container.innerHTML = '';

            if (filteredData.length === 0) {
                container.innerHTML = '<div class="text-center text-white/50 text-sm mt-10">No signals match criteria.</div>';
                return;
            }

            filteredData.forEach(row => {
                const div = document.createElement('div');
                const isSelected = currentSymbol === row.Symbol;
                
                div.className = `p-4 rounded-xl cursor-pointer transition-all border ${isSelected ? 'bg-white/10 border-white/30' : 'bg-white/[0.02] border-white/5 hover:bg-white/5'} flex justify-between items-center`;
                
                let sentColor = 'text-white/50';
                const st = row['ST Sentiment'] || '';
                if (st.includes('Bull')) sentColor = 'text-emerald-400';
                if (st.includes('Bear')) sentColor = 'text-rose-400';

                div.innerHTML = `
                    <div>
                        <div class="font-bold text-lg">${row.Symbol}</div>
                        <div class="text-xs text-white/50 mt-1">${row['Trading_Setup'] || 'N/A'}</div>
                    </div>
                    <div class="text-right">
                        <div class="text-xs font-medium ${sentColor}">${st}</div>
                        <div class="text-[10px] text-white/30 mt-1">Vol: ${row.RVol || '-'}</div>
                    </div>
                `;
                
                div.onclick = () => selectStock(row);
                container.appendChild(div);
            });
        }

        function selectStock(row) {
            currentSymbol = row.Symbol;
            renderList(); 
            
            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('dashboard-content').classList.remove('hidden');
            
            // Trigger Mobile View Router Logic
            if (window.innerWidth <= 768) {
                document.body.classList.add('view-dashboard');
                document.getElementById('mobile-ticker-title').textContent = row.Symbol;
                window.scrollTo({ top: 0, behavior: 'instant' });
            }

            document.getElementById('dash-symbol').textContent = row.Symbol;
            document.getElementById('dash-date').textContent = row.Date || 'Latest Data';

            // Extract Summaries
            currentSummaries[0].text = row['ST Bull Summary'] || 'No distinct Short Term Bullish factors recorded.';
            currentSummaries[1].text = row['ST Bear Summary'] || 'No distinct Short Term Bearish factors recorded.';
            currentSummaries[2].text = row['LT Bull Summary'] || 'No distinct Long Term Bullish factors recorded.';
            currentSummaries[3].text = row['LT Bear Summary'] || 'No distinct Long Term Bearish factors recorded.';
            
            // Reset to first slide & render
            summaryIdx = 0;
            renderSummaryCard();

            // Build Badges
            const badgesContainer = document.getElementById('dash-badges');
            badgesContainer.innerHTML = '';
            const createBadge = (text, type) => {
                if(!text || text === 'None' || text === 'N/A') return;
                let bg = 'bg-white/10 text-white';
                if(text.includes('Bull')) bg = 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30';
                if(text.includes('Bear')) bg = 'bg-rose-500/20 text-rose-400 border border-rose-500/30';
                return `<span class="px-3 py-1 rounded-full text-xs font-semibold ${bg}">${text}</span>`;
            };
            
            const badgesHTML = [
                createBadge(row['ST Sentiment'], 'st'),
                createBadge(row['LT Sentiment'], 'lt'),
                createBadge(row['Trading_Setup'], 'setup')
            ].filter(Boolean).join('');
            badgesContainer.innerHTML = badgesHTML;

            renderMetricsGrid(row);
            injectTVWidgets(row.Symbol);
        }

        // --- Summary Card Navigation & Modal ---
        function renderSummaryCard() {
            const data = currentSummaries[summaryIdx];
            
            // Update Card
            const titleEl = document.getElementById('summary-title');
            titleEl.textContent = data.title;
            titleEl.className = `text-base font-bold mb-4 uppercase tracking-widest ${data.color}`;
            document.getElementById('summary-text').textContent = data.text;
            
            // Update Modal (in case it is open)
            const modalTitleEl = document.getElementById('modal-title');
            modalTitleEl.textContent = data.title;
            modalTitleEl.className = `text-xl font-bold mb-6 uppercase tracking-widest ${data.color}`;
            document.getElementById('modal-text').textContent = data.text;
            
            // Update dots
            for(let i=0; i<4; i++) {
                const dot = document.getElementById(`dot-${i}`);
                if(i === summaryIdx) {
                    dot.classList.replace('bg-white/20', 'bg-white/80');
                } else {
                    dot.classList.replace('bg-white/80', 'bg-white/20');
                }
            }
        }

        function nextSummary() { 
            summaryIdx = (summaryIdx + 1) % 4; 
            renderSummaryCard(); 
        }

        function prevSummary() { 
            summaryIdx = (summaryIdx - 1 + 4) % 4; 
            renderSummaryCard(); 
        }

        function openSummaryModal() {
            // Render to ensure UI matches current state
            renderSummaryCard();
            document.getElementById('summary-modal').classList.remove('hidden');
        }

        function closeSummaryModal() {
            document.getElementById('summary-modal').classList.add('hidden');
        }

        // Close modal on background click
        document.getElementById('summary-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeSummaryModal();
            }
        });

        // --- Collapsible Metrics ---
        function toggleMetrics() {
            const content = document.getElementById('metrics-content');
            const chevron = document.getElementById('metrics-chevron');
            
            if (content.classList.contains('hidden')) {
                content.classList.remove('hidden');
                chevron.style.transform = 'rotate(180deg)';
            } else {
                content.classList.add('hidden');
                chevron.style.transform = 'rotate(0deg)';
            }
        }

        function renderMetricsGrid(dataRow) {
            const grid = document.getElementById('metrics-grid');
            grid.innerHTML = '';
            
            // Exclude text-heavy or redundant columns from the quantitative grid
            const excludedKeys = ['Symbol', 'Date', 'ST Bull Summary', 'ST Bear Summary', 'LT Bull Summary', 'LT Bear Summary', 'ST_Bullish_Text', 'ST_Bearish_Text', 'LT_Bullish_Text', 'LT_Bearish_Text'];
            
            Object.entries(dataRow).forEach(([key, value]) => {
                if (excludedKeys.includes(key) || !value || value.length > 50) return;
                
                const item = document.createElement('div');
                item.className = 'flex flex-col';
                item.innerHTML = `
                    <span class="text-[10px] text-white/40 uppercase tracking-wider truncate" title="${key}">${key.replace(/_/g, ' ')}</span>
                    <span class="font-medium text-white/90 truncate mt-0.5" title="${value}">${value}</span>
                `;
                grid.appendChild(item);
            });
        }

        // --- Mobile Navigation ---
        function backToList() {
            document.body.classList.remove('view-dashboard');
            currentSymbol = null;
            renderList(); // clear highlight from list
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // --- TradingView Injections ---
        function injectTVWidgets(symbol) {
            const tvSymbol = `NASDAQ:${symbol}`;

            // Overview
            renderTVWidget('tv-overview', 'https://s3.tradingview.com/external-embedding/embed-widget-symbol-overview.js', {
                "symbols": [[`${tvSymbol}|1D`]],
                "chartOnly": false,
                "width": "100%",
                "height": "100%",
                "locale": "en",
                "colorTheme": "dark",
                "autosize": true,
                "showVolume": false,
                "showMA": false,
                "hideDateRanges": false,
                "hideMarketStatus": false,
                "hideSymbolLogo": false,
                "scalePosition": "right",
                "scaleMode": "Normal",
                "fontFamily": "-apple-system, BlinkMacSystemFont, Trebuchet MS, Roboto, Ubuntu, sans-serif",
                "fontSize": "10",
                "noTimeScale": false,
                "valuesTracking": "1",
                "changeMode": "price-and-percent",
                "chartType": "area",
                "backgroundColor": "rgba(0, 0, 0, 0)",
                "lineWidth": 2,
                "lineType": 0
            });

            // Technical Analysis (Defaulting to 1 Day interval)
            renderTVWidget('tv-technical', 'https://s3.tradingview.com/external-embedding/embed-widget-technical-analysis.js', {
                "interval": "1D",
                "width": "100%",
                "height": "100%",
                "symbol": tvSymbol,
                "showIntervalTabs": true,
                "displayMode": "single",
                "locale": "en",
                "colorTheme": "dark",
                "isTransparent": true
            });

            // Financials
            renderTVWidget('tv-financials', 'https://s3.tradingview.com/external-embedding/embed-widget-financials.js', {
                "symbol": tvSymbol,
                "width": "100%",
                "height": "100%",
                "colorTheme": "dark",
                "isTransparent": true,
                "displayMode": "regular",
                "locale": "en"
            });

            // News Timeline
            renderTVWidget('tv-timeline', 'https://s3.tradingview.com/external-embedding/embed-widget-timeline.js', {
                "feedMode": "symbol",
                "symbol": tvSymbol,
                "width": "100%",
                "height": "100%",
                "colorTheme": "dark",
                "isTransparent": true,
                "displayMode": "regular",
                "locale": "en"
            });

            // Info Details
            renderTVWidget('tv-info', 'https://s3.tradingview.com/external-embedding/embed-widget-symbol-info.js', {
                "symbol": tvSymbol,
                "width": "100%",
                "height": "100%",
                "colorTheme": "dark",
                "isTransparent": true,
                "locale": "en"
            });
        }

        function renderTVWidget(containerId, scriptSrc, config) {
            const container = document.getElementById(containerId);
            container.innerHTML = ''; 

            const widgetContainer = document.createElement('div');
            widgetContainer.className = 'tradingview-widget-container';
            widgetContainer.style.height = '100%';
            widgetContainer.style.width = '100%';
            
            const widgetDiv = document.createElement('div');
            widgetDiv.className = 'tradingview-widget-container__widget';
            widgetDiv.style.height = '100%';
            widgetDiv.style.width = '100%';

            const script = document.createElement('script');
            script.type = 'text/javascript';
            script.src = scriptSrc;
            script.async = true;
            script.textContent = JSON.stringify(config);
            
            widgetContainer.appendChild(widgetDiv);
            widgetContainer.appendChild(script);
            container.appendChild(widgetContainer);
        }
    </script>
</body>
</html>
